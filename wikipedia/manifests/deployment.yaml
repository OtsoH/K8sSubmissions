apiVersion: apps/v1
kind: Deployment
metadata:
  name: wikipedia-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wikipedia
  template:
    metadata:
      labels:
        app: wikipedia
    spec:
      volumes:
        - name: www
          emptyDir: {}
      initContainers:
        - name: fetch-kubernetes
          image: curlimages/curl:8.11.1
          args:
            - -fsSL
            - -A
            - DevOpsWithKubernetes-exercise/1.0
            - -o
            - /www/index.html
            - https://en.wikipedia.org/wiki/Kubernetes
          volumeMounts:
            - name: www
              mountPath: /www
        - name: fetch-random
          image: curlimages/curl:8.11.1
          restartPolicy: Always
          command:
            - sh
            - -c
            - |
              while true; do
                sleep $((300 + RANDOM % 601))
                curl -fsSL -A DevOpsWithKubernetes-exercise/1.0 -o /www/next.html https://en.wikipedia.org/wiki/Special:Random \
                  && mv /www/next.html /www/index.html \
                  && echo "$(date) fetched a random page"
              done
          volumeMounts:
            - name: www
              mountPath: /www
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          volumeMounts:
            - name: www
              mountPath: /usr/share/nginx/html
              readOnly: true
