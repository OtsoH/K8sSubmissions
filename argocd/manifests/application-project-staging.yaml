apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: the-project-staging
spec:
  project: default
  source:
    repoURL: https://github.com/OtsoH/K8sSubmissions-config.git
    targetRevision: main
    path: overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: project-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
