apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong-dep
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      containers:
        - name: ping-pong
          image: europe-north1-docker.pkg.dev/dwk-gke-507418/dwk-images/ping-pong:1.3
          env:
            - name: PORT
              value: "3000"
            - name: PGHOST
              value: postgres-svc
            - name: PGUSER
              value: pingpong
            - name: PGDATABASE
              value: pingpong
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
