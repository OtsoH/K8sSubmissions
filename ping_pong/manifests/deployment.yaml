apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      volumes:
        - name: shared-storage
          persistentVolumeClaim:
            claimName: shared-data-pvc
      containers:
        - name: ping-pong
          image: ping-pong:1.0
          volumeMounts:
            - name: shared-storage
              mountPath: /app/data
          env:
            - name: PORT
              value: "3000"
