apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: project

resources:
  - namespace.yaml
  - postgres-configmap.yaml
  - postgres-secret.yaml
  - postgres-service.yaml
  - postgres-statefulset.yaml
  - persistent-volume-claim.yaml
  - todo-app-deployment.yaml
  - todo-app-service.yaml
  - todo-backend-deployment.yaml
  - todo-backend-service.yaml
  - wikipedia-todo-cronjob.yaml
  - gateway.yaml
  - httproute.yaml

images:
  - name: todo-app
    newName: europe-north1-docker.pkg.dev/dwk-gke-507418/dwk-images/todo-app
    newTag: "1.6"
  - name: todo-backend
    newName: europe-north1-docker.pkg.dev/dwk-gke-507418/dwk-images/todo-backend
    newTag: "1.2"
