apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7777"
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          args: ["-m", "8222"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: metrics
          image: natsio/prometheus-nats-exporter:0.20.2
          args: ["-port=7777", "-varz", "-subz", "-connz", "http://localhost:8222"]
          ports:
            - containerPort: 7777
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nats-svc
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
