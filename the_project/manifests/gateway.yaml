apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: project-gateway
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      protocol: HTTP
      # Traefik attaches a listener to the entrypoint with the same port, and
      # its web entrypoint listens on 8000 inside the pod (published as 80).
      port: 8000
      hostname: project.localhost
      allowedRoutes:
        namespaces:
          from: Same
