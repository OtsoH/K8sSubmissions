name: Release the project

on:
  push:
    branches:
      - main
    paths:
      - the_project/**

jobs:
  build-publish:
    name: Build, push, release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP: ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:${{ github.sha }}
      BACKEND: ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:${{ github.sha }}
      BROADCASTER: ${{ secrets.DOCKERHUB_USERNAME }}/broadcaster:${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish
        run: |
          docker build --tag "$APP" the_project/todo-app
          docker build --tag "$BACKEND" the_project/todo-backend
          docker build --tag "$BROADCASTER" the_project/broadcaster
          docker push "$APP"
          docker push "$BACKEND"
          docker push "$BROADCASTER"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Point the manifests at the new images
        working-directory: the_project/manifests
        run: |
          kustomize edit set image todo-app="$APP"
          kustomize edit set image todo-backend="$BACKEND"
          kustomize edit set image broadcaster="$BROADCASTER"

      - name: Commit the new tags
        uses: EndBug/add-and-commit@v10
        with:
          add: the_project/manifests/kustomization.yaml
          message: release the project ${{ github.sha }}
